<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting Co. for inquiries, reservations, and adventure information.">
    <meta name="author" content="Kelvin O. Van-Addo">
    <title>Contact Us | White Water Rafting Co.</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="images/crossed-oars.png" alt="Company logo">

        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO -->
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street<br>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- MAP + FORM -->
        <section class="contact-layout">

            <!-- MAP -->
            <div class="map">
                <iframe src="https://www.google.com/maps?q=kolob+utah&output=embed"
                  loading="lazy"></iframe>
            </div>

            <!-- FORM -->
            <form>
                <!-- NAME -->
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <!-- EMAIL -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <!-- PURPOSE -->
                <p>Message Purpose</p>

                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="general" name="purpose" value="general">
                        <label for="general">General Inquiry</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </div>

                <!-- MESSAGE -->
                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>

                <!-- SUBSCRIBE -->
                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">Please subscribe me to the monthly newsletter</label>

                <!-- BUTTON -->
                <button type="submit">Get in Touch!</button>
            </form>

        </section>

        <!-- EMPLOYEES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee1.jpg" alt="Guide Kobby leading a rafting trip">
                    <figcaption>Kobby – Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Instructor Winfred training clients">
                    <figcaption>Winfred – Safety Instructor</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Coordinator Kumah organizing trips">
                    <figcaption>Kumah – Trip Coordinator</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 White Water Rafting Co. | Kelvin Offei Van-Addo</p>

        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.svg" alt="Visit our Facebook page"></a>
            <a href="#"><img src="images/linkedin.svg" alt="Connect with us on LinkedIn"></a>
            <a href="#"><img src="images/instagram.svg" alt="Follow us on Instagram"></a>
        </nav>
    </footer>

</body>

</html>
